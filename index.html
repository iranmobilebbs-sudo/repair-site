<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پذیرش تعمیرات گوشی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff2;--card:#fff;--ink:#14212b;--mute:#5d6b76;--line:#d5dce2;--acc:#0b6e8a;--accink:#fff;--hit:#fff6d6;--warn:#fff1c2;--s1:#8a5a00;--s2:#0b6e8a;--s3:#1c7a3a;--s4:#5d6b76;--s5:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171c;--card:#19232b;--ink:#e8eef2;--mute:#97a6b1;--line:#2b3a45;--acc:#4cb8d6;--accink:#06222c;--hit:#3b3310;--warn:#4a3d10;--s1:#f0b94a;--s2:#4cb8d6;--s3:#62d08a;--s4:#97a6b1;--s5:#ff8a80}}
:root[data-theme="dark"]{--bg:#10171c;--card:#19232b;--ink:#e8eef2;--mute:#97a6b1;--line:#2b3a45;--acc:#4cb8d6;--accink:#06222c;--hit:#3b3310;--warn:#4a3d10;--s1:#f0b94a;--s2:#4cb8d6;--s3:#62d08a;--s4:#97a6b1;--s5:#ff8a80}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;font-weight:800;margin:4px 0 12px}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.who{font-size:.9rem;color:var(--mute);display:flex;gap:12px;align-items:center}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 4px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=checkbox]{width:auto}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.filters,.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 4px}
.f{flex:none;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:3px 13px;font-size:.88rem}
.f.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.count{color:var(--mute);font-size:.85rem;margin:6px 2px}
.banner{background:var(--warn);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:800;font-size:1.05rem}
.code{direction:ltr;font-weight:800;letter-spacing:.14em;border:1.5px solid var(--acc);color:var(--acc);border-radius:8px;padding:0 10px;font-size:1rem}
.meta{color:var(--mute);font-size:.9rem;margin-top:2px}
.prob{margin:8px 0 2px;white-space:pre-wrap}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.st{font-weight:600;font-size:.9rem;border-radius:8px;border:1.5px solid currentColor;background:transparent;padding:2px 8px;width:auto}
.st1{color:var(--s1)}.st2{color:var(--s2)}.st3{color:var(--s3)}.st4{color:var(--s4)}.st5{color:var(--s5)}
.date{color:var(--mute);font-size:.8rem}
.acts{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.link{background:none;border:0;color:var(--acc);padding:2px 0;font-weight:600}
.link.del{color:var(--s5)}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:10px;padding:11px 16px;font-weight:800}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--s5);color:#fff}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:999px;padding:13px 22px}
dialog{border:0;border-radius:16px;padding:18px;width:min(520px,94vw);background:var(--card);color:var(--ink)}
dialog.big{width:min(640px,96vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:.9rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.big{direction:ltr;text-align:center;font-size:2.4rem;font-weight:800;letter-spacing:.2em;color:var(--acc);margin:14px 0}
.chip2{border:1.5px solid var(--line);border-radius:8px;padding:0 8px;font-size:.8rem;margin-inline-start:6px}
.ok{color:var(--s3)}.off{color:var(--s5)}
mark{background:#ffd54a;color:#000;border-radius:3px;padding:0 2px}
.err{color:var(--s5);font-size:.85rem;min-height:1.2em}
.pad{height:90px}
</style>
</head>
<body>

<div id="login" hidden>
  <div class="wrap">
    <h1>پذیرش تعمیرات گوشی</h1>
    <div class="item" id="lbox"></div>
    <button class="link" id="l-gh">اتصال دستگاه جدید به GitHub</button>
  </div>
</div>

<div id="app" hidden>
  <div class="wrap">
    <div class="hdr">
      <h1>پذیرش تعمیرات گوشی</h1>
      <div class="who"><span id="who"></span><button class="link" id="adm-open" hidden>مدیریت</button><button class="link" id="logout">خروج</button></div>
    </div>
    <div class="search"><input id="q" type="search" placeholder="جستجو: کد، اسم گوشی، صاحب، شماره یا مشکل" autocomplete="off"></div>
    <div class="filters" id="filters"></div>
    <div id="bk"></div>
    <div class="count" id="count"></div>
    <div class="count" id="syncst"></div>
    <div id="list"></div>
    <div class="pad"></div>
  </div>
  <button class="btn fab" id="add">+ ثبت گوشی</button>
</div>
<input type="file" id="file" accept=".json,application/json" hidden>

<dialog id="dlg">
  <div id="dt" style="font-weight:800;font-size:1.1rem">ثبت گوشی جدید</div>
  <div class="two">
    <div><label for="f-phone">اسم گوشی</label><input id="f-phone" placeholder="Samsung" list="dl-phone" autocomplete="off"></div>
    <div><label for="f-model">مدل</label><input id="f-model" placeholder="A54" list="dl-model" autocomplete="off"></div>
  </div>
  <div class="two">
    <div><label for="f-owner">اسم صاحب گوشی</label><input id="f-owner"></div>
    <div><label for="f-mobile">شماره موبایل</label><input id="f-mobile" type="tel" inputmode="tel" dir="ltr" style="text-align:right" placeholder="09..."></div>
  </div>
  <label for="f-prob">مشکل</label>
  <textarea id="f-prob" rows="3" placeholder="مثلاً: شکستگی ال‌سی‌دی، شارژ نمی‌شود"></textarea>
  <div class="two">
    <div><label for="f-cost">هزینه (تومان)</label><input id="f-cost" type="tel" inputmode="numeric" dir="ltr" style="text-align:right" autocomplete="off"></div>
    <div><label for="f-dep">بیعانه (تومان)</label><input id="f-dep" type="tel" inputmode="numeric" dir="ltr" style="text-align:right" autocomplete="off"></div>
  </div>
  <label for="f-pass">رمز گوشی (پین یا الگو)</label><input id="f-pass" dir="ltr" style="text-align:right" autocomplete="off">
  <label for="f-status">وضعیت</label>
  <select id="f-status"></select>
  <datalist id="dl-phone"></datalist><datalist id="dl-model"></datalist>
  <div class="err" id="err"></div>
  <div class="bar">
    <button class="btn" id="save">ذخیره</button>
    <button class="btn alt" id="cancel">انصراف</button>
  </div>
</dialog>

<dialog id="done">
  <div style="font-weight:800">ثبت شد. کد پیگیری:</div>
  <div class="big" id="newcode"></div>
  <div class="bar">
    <button class="btn" id="copy">کپی کد</button>
    <button class="btn alt" id="close2">بستن</button>
  </div>
</dialog>

<dialog id="gh">
  <div style="font-weight:800;font-size:1.1rem">همگام‌سازی با GitHub</div>
  <label for="g-owner">نام کاربری GitHub</label><input id="g-owner" dir="ltr" style="text-align:left" autocomplete="off">
  <label for="g-repo">نام مخزن داده (private)</label><input id="g-repo" dir="ltr" style="text-align:left" autocomplete="off">
  <label for="g-path">نام فایل داده</label><input id="g-path" dir="ltr" style="text-align:left" autocomplete="off">
  <label for="g-token">توکن (فقط روی همین دستگاه می‌ماند)</label><input id="g-token" type="password" dir="ltr" style="text-align:left" autocomplete="off">
  <div class="err" id="g-err"></div>
  <div class="bar"><button class="btn" id="g-save">ذخیره و همگام‌سازی</button><button class="btn alt" id="g-close">بستن</button></div>
</dialog>

<dialog id="adm" class="big">
  <div class="top"><div style="font-weight:800;font-size:1.2rem">پنل مدیریت</div><button class="btn alt" id="adm-close">بستن</button></div>
  <div class="tabs" id="adm-tabs"></div>
  <div id="adm-body"></div>
</dialog>

<dialog id="ud">
  <div style="font-weight:800;font-size:1.1rem" id="ud-t"></div>
  <label for="u-name">نام کاربری (حداقل ۳ حرف، بدون فاصله)</label><input id="u-name" dir="ltr" style="text-align:left" autocomplete="off">
  <label for="u-pass" id="u-pl">رمز عبور (حداقل ۶ کاراکتر)</label><input id="u-pass" dir="ltr" style="text-align:left" autocomplete="off">
  <label for="u-role">سمت در سایت</label>
  <select id="u-role"><option value="staff">کارمند (ثبت و ویرایش)</option><option value="admin">مدیر (همه‌چیز)</option></select>
  <label><input type="checkbox" id="u-act"> حساب فعال باشد</label>
  <div class="err" id="u-err"></div>
  <div class="bar"><button class="btn" id="u-save">ذخیره</button><button class="btn alt" id="u-cancel">انصراف</button></div>
</dialog>

<script>
(function(){
  var K_I='repair-intake-v2',K_M='repair-intake-meta',K_S='repair-intake-ses',K_D='repair-intake-dev',GH='repair-intake-gh',BK='repair-intake-lastbackup2';
  var ST=['تحویل گرفته شد','در حال تعمیر','آماده تحویل','تحویل داده شد','تعمیر نشد'];
  var BR={'Samsung':['Galaxy A03','A04','A05','A14','A15','A24','A25','A34','A35','A54','A55','S21','S22','S23','S24','J7','Note 10','Note 20'],'Apple':['iPhone 7','iPhone 8','iPhone X','iPhone XR','iPhone 11','iPhone 12','iPhone 13','iPhone 14','iPhone 15'],'iPhone':['7','8','X','XR','XS','11','12','13','14','15'],'Xiaomi':['Redmi 9A','Redmi 10','Redmi 12','Redmi 13C','Redmi Note 10','Redmi Note 11','Redmi Note 12','Redmi Note 13','Poco X3','Poco X5','Poco F5','Mi 11','12T','13T'],'Redmi':['9A','9C','10C','12','12C','13C','Note 9','Note 10','Note 11','Note 12','Note 13'],'Poco':['X3 Pro','X4 Pro','X5','X6','M5','F5'],'Huawei':['Y6','Y7','Y9','P20 Lite','P30 Lite','Nova 3i','Nova 5T','Mate 20'],'Honor':['X6','X7','X8','X9','50 Lite','70','90'],'Nokia':['C21','C32','G10','G21','1.4'],'Realme':['C11','C25','C35','C55','8','9','10','11'],'Oppo':['A15','A17','A57','A58','Reno 6','Reno 8'],'Vivo':['Y12','Y20','Y21','Y33s','V21','V23'],'Motorola':['G Power','G13','G23','Edge 30'],'OnePlus':['Nord CE','Nord 2','9','10 Pro'],'Infinix':['Hot 10','Hot 20','Hot 30','Note 12','Smart 7'],'Tecno':['Spark 8','Spark 10','Camon 19'],'Sony':['Xperia 1','Xperia 5','Xperia 10'],'LG':['G6','G7','K50'],'Google Pixel':['4a','6','7','8'],'Asus':['Zenfone 8','ROG Phone 6'],'Lenovo':[],'ZTE':[],'Alcatel':[],'Itel':[],'TCL':[],'Nothing':['Phone (1)','Phone (2)']};
  var items=[],meta={users:[],devices:[],audit:[],resetAt:0},me=null,devId='',flt=-1,editCode=null,editUid=null,tab='users';
  var syncing=false,again=false,tm,dN=0,sN=0,syncedOnce=false,loginMsg='',lmode='';
  var $=function(i){return document.getElementById(i)};
  var ROLES={owner:'مدیر کل',admin:'مدیر',staff:'کارمند',tech:'تعمیرکار'};
  function isOwner(){return !!me&&me.role==='owner'}
  function isMgr(){return !!me&&(me.role==='owner'||me.role==='admin')}
  function canEditUser(u){return isOwner()||(isMgr()&&(u.role==='staff'||u.role==='tech'))}
  function ensureOwner(){if(!meta.users.length||meta.users.some(function(u){return u.role==='owner'}))return;var a=meta.users.filter(function(u){return u.role==='admin'&&u.active}).sort(function(x,y){return x.created-y.created})[0];if(a){a.role='owner';a.updated=Date.now();touch()}}

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function norm(s){return String(s||'').toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[۰-۹]/g,function(d){return d.charCodeAt(0)-1776}).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632})}
  function hl(text,terms){var t=esc(text);terms.forEach(function(w){if(!w)return;var re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');t=t.replace(re,'<mark>$1</mark>')});return t}
  function fdate(ts){try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(ts))}catch(e){return new Date(ts).toLocaleString()}}
  function rid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
  function digits(s){return norm(s).replace(/\D/g,'')}
  function money(el){var d=digits(el.value);el.value=d?Number(d).toLocaleString('en-US'):''}
  function fm(n){return Number(n).toLocaleString('fa-IR')}
  function delivFor(rec,st,now){return st===3?{delivered:rec.delivered||now}:{delivered:null}}
  function live(){return items.filter(function(i){return !i.deleted})}
  function newCode(){var A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',c;do{c='';for(var i=0;i<5;i++)c+=A.charAt(Math.floor(Math.random()*A.length))}while(items.some(function(x){return x.code===c}));return c}

  /* ---------- storage ---------- */
  function load(){
    try{items=JSON.parse(localStorage.getItem(K_I)||'[]')||[]}catch(e){items=[]}
    try{var m=JSON.parse(localStorage.getItem(K_M)||'null');if(m)meta={users:m.users||[],devices:m.devices||[],audit:m.audit||[],resetAt:m.resetAt||0}}catch(e){}
    try{devId=localStorage.getItem(K_D)||'';if(!devId){devId=rid();localStorage.setItem(K_D,devId)}}catch(e){devId=devId||rid()}
  }
  function save(){try{localStorage.setItem(K_I,JSON.stringify(items));localStorage.setItem(K_M,JSON.stringify(meta));return true}catch(e){alert('ذخیره‌سازی در این مرورگر کار نمی‌کند. همین الان پشتیبان‌گیری کنید.');return false}}
  function touch(){var ok=save();dN++;schedSync();return ok}
  function log(a,d){meta.audit.push({id:rid(),ts:Date.now(),user:me?me.username:'-',a:a,d:d||''});if(meta.audit.length>300)meta.audit=meta.audit.slice(-300)}

  /* ---------- crypto / users / devices ---------- */
  function hex(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}
  function hashPw(pw,salt){
    if(!window.crypto||!crypto.subtle)return Promise.reject(new Error('nosub'));
    var enc=new TextEncoder();
    return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},k,256)}).then(hex)
  }
  function mkUser(un,pw,role){var salt=rid()+rid();return hashPw(pw,salt).then(function(h){var now=Date.now();return {id:rid(),username:un,salt:salt,hash:h,role:role,active:true,created:now,updated:now}})}
  function devName(){var u=navigator.userAgent,o=/Android/.test(u)?'Android':/iPhone|iPad/.test(u)?'iOS':/Windows/.test(u)?'Windows':/Mac/.test(u)?'Mac':/Linux/.test(u)?'Linux':'?';var b=/Edg\//.test(u)?'Edge':/OPR\//.test(u)?'Opera':/Firefox/.test(u)?'Firefox':/Chrome/.test(u)?'Chrome':/Safari/.test(u)?'Safari':'?';return o+' / '+b}
  function thisDev(){return meta.devices.filter(function(x){return x.id===devId})[0]}
  function regDevice(){var now=Date.now(),d=thisDev();if(!d)meta.devices.push({id:devId,name:devName(),user:me.id,username:me.username,first:now,lastSeen:now,revoked:false,updated:now});else{d.user=me.id;d.username=me.username;d.lastSeen=now;d.updated=now}}
  function setSes(u){try{localStorage.setItem(K_S,JSON.stringify({uid:u.id}))}catch(e){}}
  function checkSession(){
    var s=null;try{s=JSON.parse(localStorage.getItem(K_S)||'null')}catch(e){}
    var u=s&&meta.users.filter(function(x){return x.id===s.uid})[0],dv=thisDev();
    if(u&&u.active&&!(dv&&dv.revoked)){me=u;return true}
    if(s){try{localStorage.removeItem(K_S)}catch(e){}loginMsg=(dv&&dv.revoked)?'این دستگاه توسط مدیر قطع شد.':'دسترسی این حساب غیرفعال شده است.'}
    me=null;return false
  }
  function touchSeen(){var d=thisDev();if(!d||!me)return;if(Date.now()-(d.lastSeen||0)>6e5){d.lastSeen=Date.now();d.updated=d.lastSeen;touch()}}

  /* ---------- gate: login or app ---------- */
  function gate(){
    ensureOwner();var ok=checkSession();
    if(!ok||!isMgr()){if($('adm').open)$('adm').close()}
    $('app').hidden=!ok;$('login').hidden=ok;
    if(ok){lmode='';$('who').textContent=me.username+' ('+(ROLES[me.role]||me.role)+')';$('adm-open').hidden=!isMgr();$('add').hidden=me.role==='tech';render();touchSeen()}
    else renderLogin(false)
  }
  function lmodeNow(){if(meta.users.length)return 'login';var c=ghCfg();return (c&&c.token&&!syncedOnce)?'wait':'setup'}
  function renderLogin(force){
    var m=lmodeNow();if(m===lmode&&!force&&!loginMsg)return;lmode=m;var h='';
    var u='<label for="l-u">نام کاربری</label><input id="l-u" dir="ltr" style="text-align:left" autocomplete="username" autocapitalize="none">';
    if(m==='login')h='<div style="font-weight:800">ورود</div>'+u+'<label for="l-p">رمز عبور</label><input id="l-p" type="password" dir="ltr" style="text-align:left" autocomplete="current-password"><div class="err" id="l-err"></div><button class="btn" id="l-go">ورود</button>';
    else if(m==='setup')h='<div style="font-weight:800">ساخت حساب مدیر کل</div><div class="meta">اولین بار است. برای مدیر کل نام کاربری و رمز بسازید. این حساب به همه‌چیز دسترسی دارد.</div>'+u+'<label for="l-p">رمز عبور (حداقل ۶ کاراکتر)</label><input id="l-p" type="password" dir="ltr" style="text-align:left" autocomplete="new-password"><label for="l-p2">تکرار رمز</label><input id="l-p2" type="password" dir="ltr" style="text-align:left" autocomplete="new-password"><div class="err" id="l-err"></div><button class="btn" id="l-setup">ساخت حساب و ورود</button>';
    else h='<div>در حال دریافت حساب‌ها از GitHub...</div><div class="err" id="l-err"></div><button class="btn alt" id="l-retry">تلاش دوباره</button>';
    $('lbox').innerHTML=h;
    if(loginMsg&&$('l-err')){$('l-err').textContent=loginMsg;loginMsg=''}
  }
  function lerr(t){var e=$('l-err');if(e)e.textContent=t}
  function doLogin(){
    var un=norm($('l-u').value).trim(),pw=$('l-p').value;
    var u=meta.users.filter(function(x){return x.username===un})[0],dv=thisDev();
    if(dv&&dv.revoked){lerr('این دستگاه توسط مدیر قطع شده است.');return}
    if(!u||!u.active){lerr('نام کاربری یا رمز اشتباه است.');return}
    hashPw(pw,u.salt).then(function(h){
      if(h!==u.hash){lerr('نام کاربری یا رمز اشتباه است.');return}
      me=u;setSes(u);regDevice();log('ورود','');touch();lmode='';gate()

  function mergeList(loc,rem,key,floor){
    var m={};loc.forEach(function(x){m[x[key]]=x});
    (rem||[]).forEach(function(x){if(!x||!x[key])return;var tv=x.updated||x.ts||x.created||0;if(floor&&tv<floor)return;var o=m[x[key]];if(!o||tv>(o.updated||o.ts||o.created||0))m[x[key]]=x});

  }

    meta.users=mergeList(meta.users,d.users,'id',0);

  function differs(d){

    return [['items','code'],['users','id'],['devices','id'],['audit','id']].some(function(p){
      var a=p[0]==='items'?items:meta[p[0]],r={};(d[p[0]]||[]).forEach(function(x){if(x)r[x[p[1]]]=x});
      return a.length!==Object.keys(r).length||a.some(function(x){var y=r[x[p[1]]];return !y||(x.updated||x.ts||0)!==(y.updated||y.ts||0)})
    })

    var url='https://api.github.com/repos/'+c.owner+'/'+c.repo+'/contents/'+c.path;
    var H={'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'};
    fetch(url,{headers:H,cache:'no-store'}).then(function(r){
      if(r.status===404)return {sha:null,d:{}};
      if(!r.ok)throw new Error(r.status);
      return r.json().then(function(j){var d=JSON.parse(b64d(j.content));if(Array.isArray(d))d={items:d};return {sha:j.sha,d:d||{}}})
    }).then(function(rem){
      mergeAll(rem.d);save();syncedOnce=true;gate();admRender();
      var pushed=dN;
      if(rem.sha&&dN<=sN&&!differs(rem.d))return;
      var body={message:'update '+new Date().toISOString(),content:b64e(JSON.stringify(payload()))};if(rem.sha)body.sha=rem.sha;
      return fetch(url,{method:'PUT',headers:H,body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error(r.status);sN=pushed})
    }).then(function(){setSt('همگام‌سازی شد: '+fdate(Date.now()))}).catch(function(){setSt('همگام‌سازی نشد (اینترنت یا تنظیمات را بررسی کنید). اطلاعات روی این دستگاه سالم است.');lerr('اتصال به GitHub برقرار نشد.')}).then(function(){syncing=false;if(again){again=false;sync()}})
  }
  function openGh(){var c=ghCfg()||{};$('g-owner').value=c.owner||'';$('g-repo').value=c.repo||'';$('g-path').value=c.path||'data.json';$('g-token').value=c.token||'';$('g-err').textContent='';$('gh').showModal()}
  $('l-gh').onclick=openGh;
  $('g-close').onclick=function(){$('gh').close()};
  $('g-save').onclick=function(){
    var o=$('g-owner').value.trim(),r=$('g-repo').value.trim(),p=$('g-path').value.trim()||'data.json',t=$('g-token').value.trim();
    if(!o||!r||!t){$('g-err').textContent='همه فیلدها را پر کنید.';return}
    try{localStorage.setItem(GH,JSON.stringify({owner:o,repo:r,path:p,token:t}))}catch(e){}
    $('gh').close();syncedOnce=false;lmode='';gate();sync()
  };
  window.addEventListener('online',sync);

  load();gate();sync();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script>
</body>
