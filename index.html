<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پذیرش تعمیرات گوشی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff2;--card:#fff;--ink:#14212b;--mute:#5d6b76;--line:#d5dce2;--acc:#0b6e8a;--accink:#fff;--hit:#fff6d6;--warn:#fff1c2;--s1:#8a5a00;--s2:#0b6e8a;--s3:#1c7a3a;--s4:#5d6b76;--s5:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171c;--card:#19232b;--ink:#e8eef2;--mute:#97a6b1;--line:#2b3a45;--acc:#4cb8d6;--accink:#06222c;--hit:#3b3310;--warn:#4a3d10;--s1:#f0b94a;--s2:#4cb8d6;--s3:#62d08a;--s4:#97a6b1;--s5:#ff8a80}}
:root[data-theme="dark"]{--bg:#10171c;--card:#19232b;--ink:#e8eef2;--mute:#97a6b1;--line:#2b3a45;--acc:#4cb8d6;--accink:#06222c;--hit:#3b3310;--warn:#4a3d10;--s1:#f0b94a;--s2:#4cb8d6;--s3:#62d08a;--s4:#97a6b1;--s5:#ff8a80}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;font-weight:800;margin:4px 0 12px}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.who{font-size:.9rem;color:var(--mute);display:flex;gap:12px;align-items:center}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 4px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=checkbox]{width:auto}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.filters,.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 4px}
.f{flex:none;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:3px 13px;font-size:.88rem}
.f.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.count{color:var(--mute);font-size:.85rem;margin:6px 2px}
.banner{background:var(--warn);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:800;font-size:1.05rem}
.code{direction:ltr;font-weight:800;letter-spacing:.14em;border:1.5px solid var(--acc);color:var(--acc);border-radius:8px;padding:0 10px;font-size:1rem}
.meta{color:var(--mute);font-size:.9rem;margin-top:2px}
.prob{margin:8px 0 2px;white-space:pre-wrap}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.st{font-weight:600;font-size:.9rem;border-radius:8px;border:1.5px solid currentColor;background:transparent;padding:2px 8px;width:auto}
.st1{color:var(--s1)}.st2{color:var(--s2)}.st3{color:var(--s3)}.st4{color:var(--s4)}.st5{color:var(--s5)}
.date{color:var(--mute);font-size:.8rem}
.acts{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.link{background:none;border:0;color:var(--acc);padding:2px 0;font-weight:600}
.link.del{color:var(--s5)}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:10px;padding:11px 16px;font-weight:800}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--s5);color:#fff}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:999px;padding:13px 22px}
dialog{border:0;border-radius:16px;padding:18px;width:min(520px,94vw);background:var(--card);color:var(--ink)}
dialog.wide{width:min(640px,96vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:.9rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.bigcode{direction:ltr;text-align:center;font-size:2.4rem;font-weight:800;letter-spacing:.2em;color:var(--acc);margin:14px 0}
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.chip2{border:1.5px solid var(--line);border-radius:8px;padding:0 8px;font-size:.8rem;margin-inline-start:6px}
.ok{color:var(--s3)}.off{color:var(--s5)}
mark{background:#ffd54a;color:#000;border-radius:3px;padding:0 2px}
.err{color:var(--s5);font-size:.85rem;min-height:1.2em}
.pad{height:90px}

.pbtn{margin-inline-start:auto;flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--acc);background:transparent;color:var(--acc);display:inline-flex;align-items:center;justify-content:center;padding:0}
.pbtn:active{background:var(--acc);color:var(--accink)}
.pbtn svg{width:22px;height:22px;pointer-events:none}
#inv{position:fixed;left:-9999px;top:0;width:148mm;height:209.1mm;background:#fff;color:#111;overflow:hidden;direction:rtl}
#inv img{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#inv .fl{position:absolute;display:flex;align-items:flex-end;justify-content:flex-start;overflow:hidden;font-family:Vazirmatn,Tahoma,sans-serif;font-weight:600;line-height:1.35;color:#111;padding-bottom:.4mm}
#inv .fl span{white-space:nowrap;max-width:100%}
#inv .fl.wrap span{white-space:normal}
#inv .fl.mid{align-items:center;justify-content:center;padding-bottom:0}
#inv .foot{color:#a3abb2;font-weight:400}
#inv .no{color:#fff;font-weight:800;letter-spacing:.08em}
@page{size:A5;margin:0}
@media print{
html,body{background:#fff!important;margin:0!important;padding:0!important;height:auto!important}
:root{padding:0!important}
body>*:not(#inv){display:none!important}
#inv{position:relative!important;left:0!important;top:0!important;display:block!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div id="login" hidden>
  <div class="wrap">
    <h1>پذیرش تعمیرات گوشی</h1>
    <div class="item" id="lbox"></div>
    <button class="link" id="l-gh">اتصال دستگاه جدید به GitHub</button>
  </div>
</div>

<div id="app" hidden>
  <div class="wrap">
    <div class="hdr">
      <h1>پذیرش تعمیرات گوشی</h1>
      <div class="who"><span id="who"></span><button class="link" id="adm-open" hidden>مدیریت</button><button class="link" id="logout">خروج</button></div>
    </div>
    <div class="search"><input id="q" type="search" placeholder="جستجو: کد، اسم گوشی، صاحب، شماره یا مشکل" autocomplete="off"></div>
    <div class="filters" id="filters"></div>
    <div id="bk"></div>
    <div class="count" id="count"></div>
    <div class="count" id="syncst"></div>
    <div id="list"></div>
    <div class="pad"></div>
  </div>
  <button class="btn fab" id="add">+ ثبت گوشی</button>
</div>
<input type="file" id="file" accept=".json,application/json" hidden>

<dialog id="dlg">
  <div id="dt" style="font-weight:800;font-size:1.1rem">ثبت گوشی جدید</div>
  <div class="two">
    <div><label for="f-phone">اسم گوشی</label><input id="f-phone" placeholder="Samsung" list="dl-phone" autocomplete="off"></div>
    <div><label for="f-model">مدل</label><input id="f-model" placeholder="A54" list="dl-model" autocomplete="off"></div>
  </div>
  <div class="two">
    <div><label for="f-owner">اسم صاحب گوشی</label><input id="f-owner"></div>
    <div><label for="f-mobile">شماره موبایل</label><input id="f-mobile" type="tel" inputmode="tel" dir="ltr" style="text-align:right" placeholder="09..."></div>
  </div>
  <label for="f-prob">مشکل</label>
  <textarea id="f-prob" rows="3" placeholder="مثلاً: شکستگی ال‌سی‌دی، شارژ نمی‌شود"></textarea>
  <div class="two">
    <div><label for="f-cost">هزینه (تومان)</label><input id="f-cost" type="tel" inputmode="numeric" dir="ltr" style="text-align:right" autocomplete="off"></div>
    <div><label for="f-dep">بیعانه (تومان)</label><input id="f-dep" type="tel" inputmode="numeric" dir="ltr" style="text-align:right" autocomplete="off"></div>
  </div>
  <label for="f-pass">رمز گوشی (پین یا الگو)</label><input id="f-pass" dir="ltr" style="text-align:right" autocomplete="off">
  <label for="f-status">وضعیت</label>
  <select id="f-status"></select>
  <datalist id="dl-phone"></datalist><datalist id="dl-model"></datalist>
  <div class="err" id="err"></div>
  <div class="bar">
    <button class="btn" id="save">ذخیره</button>
    <button class="btn alt" id="cancel">انصراف</button>
  </div>
</dialog>

<dialog id="done">
  <div style="font-weight:800">ثبت شد. کد پیگیری:</div>
  <div class="bigcode" id="newcode"></div>
  <div class="bar">
    <button class="btn" id="copy">کپی کد</button>
    <button class="btn alt" id="close2">بستن</button>
  </div>
</dialog>

<dialog id="gh">
  <div style="font-weight:800;font-size:1.1rem">همگام‌سازی با GitHub</div>
  <label for="g-owner">نام کاربری GitHub</label><input id="g-owner" dir="ltr" style="text-align:left" autocomplete="off">
  <label for="g-repo">نام مخزن داده (private)</label><input id="g-repo" dir="ltr" style="text-align:left" autocomplete="off">
  <label for="g-path">نام فایل داده</label><input id="g-path" dir="ltr" style="text-align:left" autocomplete="off">
  <label for="g-token">توکن (فقط روی همین دستگاه می‌ماند)</label><input id="g-token" type="password" dir="ltr" style="text-align:left" autocomplete="off">
  <div class="err" id="g-err"></div>
  <div class="bar"><button class="btn" id="g-save">ذخیره و همگام‌سازی</button><button class="btn alt" id="g-close">بستن</button></div>
</dialog>

<dialog id="adm" class="wide">
  <div class="top"><div style="font-weight:800;font-size:1.2rem">پنل مدیریت</div><button class="btn alt" id="adm-close">بستن</button></div>
  <div class="tabs" id="adm-tabs"></div>
  <div id="adm-body"></div>
</dialog>

<dialog id="ud">
  <div style="font-weight:800;font-size:1.1rem" id="ud-t"></div>
  <label for="u-name">نام کاربری (حداقل ۳ حرف، بدون فاصله)</label><input id="u-name" dir="ltr" style="text-align:left" autocomplete="off">
  <label for="u-pass" id="u-pl">رمز عبور (حداقل ۶ کاراکتر)</label><input id="u-pass" dir="ltr" style="text-align:left" autocomplete="off">
  <label for="u-role">سمت در سایت</label>
  <select id="u-role"><option value="staff">کارمند (ثبت و ویرایش)</option><option value="admin">مدیر (همه‌چیز)</option></select>
  <label><input type="checkbox" id="u-act"> حساب فعال باشد</label>
  <div class="err" id="u-err"></div>
  <div class="bar"><button class="btn" id="u-save">ذخیره</button><button class="btn alt" id="u-cancel">انصراف</button></div>
</dialog>

    $('adm-tabs').innerHTML=T.map(function(t){return '<button class="f'+(tab===t[0]?' on':'')+'" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('');
    if(tab==='users'){
      h='<button class="btn" data-nu="1">+ کاربر جدید</button>'+meta.users.slice().sort(function(a,b){return a.created-b.created}).map(function(u){
        return '<div class="item"><div class="top"><div class="name">'+esc(u.username)+'</div><div><span class="chip2">'+(ROLES[u.role]||u.role)+'</span><span class="chip2 '+(u.active?'ok':'off')+'">'+(u.active?'فعال':'غیرفعال')+'</span></div></div><div class="acts">'+(canEditUser(u)?'<button class="link" data-eu="'+u.id+'">ویرایش / تغییر رمز</button>':'')+'</div></div>'}).join('')
    }else if(tab==='devs'){
      h=meta.devices.length?meta.devices.slice().sort(function(a,b){return (b.lastSeen||0)-(a.lastSeen||0)}).map(function(d){
        return '<div class="item"><div class="top"><div><div class="name">'+esc(d.name)+(d.id===devId?' (این دستگاه)':'')+'</div><div class="meta">'+esc(d.username||'')+' - آخرین فعالیت: '+fdate(d.lastSeen||d.first)+'</div></div><span class="chip2 '+(d.revoked?'off':'ok')+'">'+(d.revoked?'قطع شده':'مجاز')+'</span></div><div class="acts"><button class="link'+(d.revoked?'':' del')+'" data-rv="'+d.id+'">'+(d.revoked?'وصل کردن دوباره':'قطع دسترسی')+'</button><button class="link" data-rn="'+d.id+'">تغییر نام</button></div></div>'}).join(''):'<div class="empty">دستگاهی ثبت نشده.</div>'
    }else if(tab==='trash'){
      var D=items.filter(function(i){return i.deleted});
      h=D.length?D.map(function(it){return '<div class="item"><div class="top"><div><div class="name">'+esc(it.phone+' '+it.model)+'</div><div class="meta">'+esc(it.owner)+'</div></div><div class="code">'+esc(it.code)+'</div></div><div class="acts"><button class="link" data-rs="'+it.code+'">بازگردانی</button></div></div>'}).join(''):'<div class="empty">چیزی حذف نشده.</div>'
    }else if(tab==='log'){
      h=meta.audit.length?meta.audit.slice().reverse().slice(0,80).map(function(a){return '<div class="item"><div class="name" style="font-size:.95rem">'+esc(a.a)+' <span class="meta">'+esc(a.user)+'</span></div><div class="meta">'+esc(a.d)+'</div><div class="date">'+fdate(a.ts)+'</div></div>'}).join(''):'<div class="empty">هنوز گزارشی نیست.</div>'
    }else{
      h='<div class="item"><div class="name">همگام‌سازی GitHub</div><div class="acts"><button class="btn alt" data-gh="1">تنظیمات GitHub</button></div></div>'+
      '<div class="item"><div class="name">پشتیبان‌گیری</div><div class="acts"><button class="btn alt" data-bk="1">ذخیره فایل پشتیبان</button><button class="btn alt" data-rt="1">بازیابی از فایل</button></div></div>'+
      '<div class="item"><div class="name off">ریست کامل</div><div class="meta">همه لیست‌ها پاک می‌شود، دستگاه‌های کارمندها قطع می‌شود و حساب کارمندها غیرفعال می‌شود. حساب مدیر کل می‌ماند. مدیرها و بقیه حساب‌ها هم غیرفعال می‌شوند. برگشت ندارد.</div><div class="acts"><button class="btn danger" data-rst="1">ریست کامل سایت</button></div></div>'
    }
    $('adm-body').innerHTML=h
  }
  $('adm-open').onclick=function(){tab='users';$('adm').showModal();admRender()};
  $('adm').onclick=function(e){
    var t=e.target,d=t.dataset;
    if(d.t){tab=d.t;admRender()}
    else if(d.nu)openUd(null);
    else if(d.eu)openUd(d.eu);
    else if(d.rv)toggleDev(d.rv);
    else if(d.rn)renDev(d.rn);
    else if(d.rs)restore(d.rs);
    else if(d.gh)openGh();
    else if(d.bk)doBackup();
    else if(d.rt)$('file').click();
    else if(d.rst)doReset();
    else if(t.id==='adm-close')$('adm').close()
  };
  function openUd(id){
    editUid=id;var u=id?meta.users.filter(function(x){return x.id===id})[0]:null;
    $('ud-t').textContent=u?'ویرایش کاربر':'کاربر جدید';
    $('u-name').value=u?u.username:'';$('u-pass').value='';$('u-pl').textContent=u?'رمز جدید (فقط اگر می‌خواهید عوض شود)':'رمز عبور (حداقل ۶ کاراکتر)';
    var RO=[['staff','کارمند: فقط ثبت گوشی (فقط کد، اسم گوشی، صاحب و مشکل را می‌بیند)'],['tech','تعمیرکار: فقط ویرایش و تغییر وضعیت']];if(isOwner()){RO.push(['admin','مدیر: پنل مدیریت، حذف رکورد، ساخت کارمند']);RO.push(['owner','مدیر کل: همه‌چیز'])}$('u-role').innerHTML=RO.map(function(r){return '<option value="'+r[0]+'">'+r[1]+'</option>'}).join('');$('u-role').value=u?u.role:'staff';$('u-act').checked=u?u.active:true;$('u-err').textContent='';$('ud').showModal()
  }
  $('u-cancel').onclick=function(){$('ud').close()};
  $('u-save').onclick=function(){
    var un=norm($('u-name').value).trim(),pw=$('u-pass').value,role=$('u-role').value,act=$('u-act').checked;
    var u=editUid?meta.users.filter(function(x){return x.id===editUid})[0]:null;
    function er(t){$('u-err').textContent=t}
    if(un.length<3||/\s/.test(un)){er('نام کاربری حداقل ۳ حرف و بدون فاصله باشد.');return}
    if(meta.users.some(function(x){return x.username===un&&x!==u})){er('این نام کاربری قبلاً هست.');return}
    if((!u||pw)&&pw.length<6){er('رمز حداقل ۶ کاراکتر باشد.');return}
    if(u&&!canEditUser(u)){er('اجازه ویرایش این حساب را ندارید.');return}
    if(!isOwner()&&(role==='owner'||role==='admin')){er('فقط مدیر کل می‌تواند مدیر بسازد.');return}
    var owners=meta.users.filter(function(x){return x.role==='owner'&&x.active&&x!==u}).length+((role==='owner'&&act)?1:0);
    if(owners<1){er('حداقل یک مدیر کل فعال باید باقی بماند.');return}
    var now=Date.now(),fail=function(){er('این مرورگر از رمزنگاری پشتیبانی نمی‌کند. سایت را با https باز کنید.')};
    if(u){
      var s=rid()+rid(),p=pw?hashPw(pw,s):Promise.resolve(null);
      p.then(function(h){u.username=un;u.role=role;u.active=act;u.updated=now;if(h){u.salt=s;u.hash=h}log('ویرایش کاربر',un+(h?' (رمز عوض شد)':''));touch();$('ud').close();gate();admRender()}).catch(fail)
    }else mkUser(un,pw,role).then(function(nu){nu.active=act;meta.users.push(nu);log('ساخت کاربر',un);touch();$('ud').close();admRender()}).catch(fail)
  };
  function toggleDev(id){
    var d=meta.devices.filter(function(x){return x.id===id})[0];if(!d)return;
    if(id===devId){alert('دستگاه فعلی را نمی‌توانید قطع کنید.');return}
    var du=meta.users.filter(function(x){return x.id===d.user})[0];if(du&&du.role==='owner'&&!isOwner()){alert('فقط مدیر کل می‌تواند دستگاه مدیر کل را قطع کند.');return}d.revoked=!d.revoked;d.updated=Date.now();log(d.revoked?'قطع دستگاه':'وصل دستگاه',d.name+' - '+(d.username||''));touch();admRender()
  }
  function renDev(id){var d=meta.devices.filter(function(x){return x.id===id})[0];if(!d)return;var n=prompt('نام دستگاه',d.name);if(n&&n.trim()){d.name=n.trim();d.updated=Date.now();touch();admRender()}}
  function restore(code){var it=items.filter(function(i){return i.code===code})[0];if(!it)return;it.deleted=false;it.updated=Date.now();log('بازگردانی رکورد',it.code+' '+it.phone);touch();render();admRender()}
  function doReset(){
    if(!isOwner())return;
    if(prompt('برای ریست کامل کلمه ریست را بنویسید.\nهمه لیست‌ها پاک و دستگاه‌ها و حساب‌های کارمندها قطع می‌شود.')!=='ریست')return;
    var now=Date.now();items=[];meta.resetAt=now;
    meta.devices.forEach(function(d){var u=meta.users.filter(function(x){return x.id===d.user})[0];if(d.id!==devId&&!d.revoked&&!(u&&u.role==='owner')){d.revoked=true;d.updated=now}});
    meta.users.forEach(function(u){if(u.role!=='owner'&&u.active){u.active=false;u.updated=now}});
    log('ریست کامل','');touch();render();admRender()
  }

  /* ---------- backup ---------- */
  function payload(){return {app:'repair-intake',v:2,resetAt:meta.resetAt,items:items,users:meta.users,devices:meta.devices,audit:meta.audit}}
  function doBackup(){
    var b=new Blob([JSON.stringify(payload(),null,1)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='repair-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
    try{localStorage.setItem(BK,String(Date.now()))}catch(e){}renderBackupBanner()
  }
  document.addEventListener('click',function(e){if(e.target.id==='bknow')doBackup()});
  $('file').onchange=function(){
    var f=this.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{var d=JSON.parse(r.result);if(Array.isArray(d))d={items:d};if(!d||typeof d!=='object')throw 0;
      var before=items.length;mergeAll(d);touch();gate();admRender();alert('بازیابی شد. موارد موجود حذف نمی‌شوند.')}catch(e){alert('فایل معتبر نیست.')}};
    r.readAsText(f);this.value=''
  };

  /* ---------- github sync ---------- */
  function schedSync(){clearTimeout(tm);tm=setTimeout(sync,700)}
  function ghCfg(){try{return JSON.parse(localStorage.getItem(GH)||'null')}catch(e){return null}}
  function setSt(t){$('syncst').textContent=t}
  function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
  function b64d(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,''))))}
  function mergeList(loc,rem,key,floor){
    var m={};loc.forEach(function(x){m[x[key]]=x});
    (rem||[]).forEach(function(x){if(!x||!x[key])return;var tv=x.updated||x.ts||x.created||0;if(floor&&tv<floor)return;var o=m[x[key]];if(!o||tv>(o.updated||o.ts||o.created||0))m[x[key]]=x});
    return Object.keys(m).map(function(k){return m[k]})
  }
  function mergeAll(d){
    var ra=+d.resetAt||0;
    if(ra>meta.resetAt){meta.resetAt=ra;items=[]}
    items=mergeList(items,d.items,'code',meta.resetAt);
    meta.users=mergeList(meta.users,d.users,'id',0);
    meta.devices=mergeList(meta.devices,d.devices,'id',0);
    meta.audit=mergeList(meta.audit,d.audit,'id',0).sort(function(a,b){return a.ts-b.ts}).slice(-300)
  }
  function differs(d){
    if((+d.resetAt||0)!==meta.resetAt)return true;
    return [['items','code'],['users','id'],['devices','id'],['audit','id']].some(function(p){
      var a=p[0]==='items'?items:meta[p[0]],r={};(d[p[0]]||[]).forEach(function(x){if(x)r[x[p[1]]]=x});
      return a.length!==Object.keys(r).length||a.some(function(x){var y=r[x[p[1]]];return !y||(x.updated||x.ts||0)!==(y.updated||y.ts||0)})
    })
  }
  function sync(){
    var c=ghCfg();if(!c||!c.token)return;
    if(syncing){again=true;return}
    if(navigator.onLine===false){setSt('آفلاین: با وصل شدن اینترنت همگام می‌شود');return}
    syncing=true;setSt('در حال همگام‌سازی...');
    var url='https://api.github.com/repos/'+c.owner+'/'+c.repo+'/contents/'+c.path;
    var H={'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'};
    fetch(url,{headers:H,cache:'no-store'}).then(function(r){
      if(r.status===404)return {sha:null,d:{}};
      if(!r.ok)throw new Error(r.status);
      return r.json().then(function(j){var d=JSON.parse(b64d(j.content));if(Array.isArray(d))d={items:d};return {sha:j.sha,d:d||{}}})
    }).then(function(rem){
      mergeAll(rem.d);save();syncedOnce=true;gate();admRender();
      var pushed=dN;
      if(rem.sha&&dN<=sN&&!differs(rem.d))return;
      var body={message:'update '+new Date().toISOString(),content:b64e(JSON.stringify(payload()))};if(rem.sha)body.sha=rem.sha;
      return fetch(url,{method:'PUT',headers:H,body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error(r.status);sN=pushed})
    }).then(function(){setSt('همگام‌سازی شد: '+fdate(Date.now()))}).catch(function(){setSt('همگام‌سازی نشد (اینترنت یا تنظیمات را بررسی کنید). اطلاعات روی این دستگاه سالم است.');lerr('اتصال به GitHub برقرار نشد.')}).then(function(){syncing=false;if(again){again=false;sync()}})
  }
  function openGh(){var c=ghCfg()||{};$('g-owner').value=c.owner||'';$('g-repo').value=c.repo||'';$('g-path').value=c.path||'data.json';$('g-token').value=c.token||'';$('g-err').textContent='';$('gh').showModal()}
  $('l-gh').onclick=openGh;
  $('g-close').onclick=function(){$('gh').close()};
  $('g-save').onclick=function(){
    var o=$('g-owner').value.trim(),r=$('g-repo').value.trim(),p=$('g-path').value.trim()||'data.json',t=$('g-token').value.trim();
    if(!o||!r||!t){$('g-err').textContent='همه فیلدها را پر کنید.';return}
    try{localStorage.setItem(GH,JSON.stringify({owner:o,repo:r,path:p,token:t}))}catch(e){}
    $('gh').close();syncedOnce=false;lmode='';gate();sync()
  };
  window.addEventListener('online',sync);

  load();gate();sync();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script>
</body>
